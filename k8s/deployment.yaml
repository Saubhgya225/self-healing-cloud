apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-healing-app
  namespace: self-healing-cloud
  labels:
    app: self-healing-app
    tier: backend
    version: v1.0.0
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: self-healing-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: self-healing-app
        tier: backend
    spec:
      serviceAccountName: self-healing-sa
      containers:
        - name: self-healing-container
          image: self-healing-app:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: self-healing-config
            - secretRef:
                name: self-healing-secret
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          startupProbe:
            httpGet:
              path: /health/live
              port: 8000
            failureThreshold: 15
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 4
            failureThreshold: 2
            timeoutSeconds: 2
