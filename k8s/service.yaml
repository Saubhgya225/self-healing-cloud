apiVersion: v1
kind: Service
metadata:
  name: self-healing-service
  namespace: self-healing-cloud
  labels:
    app: self-healing-app
    tier: backend
spec:
  type: NodePort
  selector:
    app: self-healing-app
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30080
      protocol: TCP
