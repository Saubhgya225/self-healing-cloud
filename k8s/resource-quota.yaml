apiVersion: v1
kind: ResourceQuota
metadata:
  name: self-healing-quota
  namespace: self-healing-cloud
spec:
  hard:
    pods: "10"
    requests.cpu: "2000m"
    requests.memory: "2Gi"
    limits.cpu: "4000m"
    limits.memory: "4Gi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: self-healing-limits
  namespace: self-healing-cloud
spec:
  limits:
    - default:
        cpu: "500m"
        memory: "256Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      type: Container
